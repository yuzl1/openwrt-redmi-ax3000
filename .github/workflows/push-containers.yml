name: Build and Push prebuilt tools container

# This branch only builds the Redmi AX3000 (RA81) image - see
# build-redmi-ax3000-arm.yml. The upstream workflows are kept for
# reference but must not spawn hours of unrelated CI on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-containers:
    name: Build and Push all prebuilt containers
    permissions:
      contents: read
      packages: write
      actions: write
    uses: openwrt/actions-shared-workflows/.github/workflows/push-containers.yml@main
