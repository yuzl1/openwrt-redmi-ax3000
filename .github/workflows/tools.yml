name: Build host tools

# This branch only builds the Redmi AX3000 (RA81) image - see
# build-redmi-ax3000-arm.yml. The upstream workflows are kept for
# reference but must not spawn hours of unrelated CI on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-tools:
    name: Build host tools for linux and macos based systems
    uses: openwrt/actions-shared-workflows/.github/workflows/tools.yml@main
